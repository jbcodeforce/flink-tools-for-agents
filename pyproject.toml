[project]
name = "flink-tools-for-agents"
version = "0.1.0"
description = "Reusable CLI tools for managing Flink SQL deployments, dbt migrations, and Kafka/Schema Registry operations — packaged as Bob/Claude agent skills"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.12.0",
    "typer>=0.12.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
flink = [
    "confluent-sql>=0.4.0",
]
kafka = [
    "confluent-kafka[avro,schema-registry]>=2.4.0",
]
dbt = [
    "authlib>=1.3.0",
    "cachetools>=5.3.0",
    "confluent-kafka>=2.4.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "sqlglot>=25.0.0",
    "dbt-confluent>=0.3.0",
    "dbt-core>=1.9.0",
]
all = [
    "flink-tools-for-agents[flink,kafka,dbt]",
]
dev = [
    "pytest>=8.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
# Flink deploy tools
flink-sql-deploy      = "tools.flink.cc_deploy.deploy_flink_statements:main"
flink-sql-snapshot    = "tools.flink.cc_deploy.run_snapshot_query:main"
flink-sql-stream      = "tools.flink.cc_deploy.run_streaming_query:main"
# Manifest tools
flink-sql-manifest    = "tools.flink.manifest.manifest_cli:app"
# Kafka / Schema Registry tools
flink-sql-cleanup     = "tools.kafka.table_cleanup:main"
flink-sql-register    = "tools.kafka.register_schema:main"
# dbt tools
flink-sql-migrate-dbt = "tools.dbt.flink_dbt_migrate.migrate_dml_to_dbt:app"
sl-dbt                = "tools.dbt.sl_dbt:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tools/flink/tests", "tools/dbt/tests", "tools/kafka/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
