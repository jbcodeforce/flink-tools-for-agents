
models:
- name: src_customers
  description: ""
  config:
    contract:
      enforced: true
  columns:
  - name: _id
    data_type: varchar(2147483647)
    constraints:
      - type: not_null
      - type: primary_key
        expression: "not enforced"
  - name: is_superhero
    data_type: boolean
  - name: review_month
    data_type: date
    constraints:
      - type: not_null
  - name: big_value
    data_type: bigint
  - name: review_ts
    data_type: timestamp_ltz
  - name: price_as_double
    data_type: decimal(10,1)
  - name: small_int
    data_type: int
